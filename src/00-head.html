<title>Gloamhold</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --void:#07090d; --pit:#0e121a; --floor:#191e29; --floor2:#151a24;
  --stone:#39415a; --stone-lit:#59628a; --stone-dk:#232839;
  --gold:#e8b13f; --blood:#cf4a3e; --jade:#57bf92; --violet:#8f6bd6;
  --bone:#ece6d8;
  --ink:#0b0d12;
}
:root{ --bone-dim:#8e8a7e; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--void); color:var(--bone);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  overscroll-behavior:none; -webkit-user-select:none; user-select:none;
  touch-action:none;
}
#stage{position:fixed;inset:0;display:block}
canvas#view{position:absolute;inset:0;width:100%;height:100%;display:block;background:var(--void);touch-action:none}

/* ---------- overlay chrome ---------- */
.panel{
  position:fixed; inset:0; z-index:20; overflow-y:auto; overscroll-behavior:contain;
  background:linear-gradient(180deg,#07090d 0%,#0b0f16 100%);
  padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 28px);
  display:flex; justify-content:center;
}
.panel[hidden]{display:none!important}
.sheet{width:100%;max-width:620px;display:flex;flex-direction:column;gap:20px}

.brand{display:flex;flex-direction:column;gap:6px}
.brand h1{
  font-family:"Silkscreen","Courier New",monospace; font-weight:700;
  font-size:clamp(28px,7vw,44px); line-height:1; margin:0; letter-spacing:.02em;
  color:var(--gold); text-wrap:balance;
}
.brand .sub{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--bone-dim);
}
.lede{margin:0;max-width:60ch;color:#c9c4b6;font-size:14px;line-height:1.6}

.group{
  border:1px solid #1e2434; border-radius:10px; background:#0d111a;
  padding:16px; display:flex; flex-direction:column; gap:14px;
}
.group > h2{
  margin:0; font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--bone-dim); font-weight:500;
}
.row{display:flex;flex-direction:column;gap:7px}
.row > label, .lbl{font-size:13px;font-weight:500;color:#d8d3c5;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.val{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums}
.hint{font-size:12px;line-height:1.5;color:#8e8a7e;margin:0}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{
  flex:1 1 120px; min-height:44px; padding:9px 12px; cursor:pointer;
  background:#141926; color:#b9b4a6; border:1px solid #242c40; border-radius:7px;
  font:500 13px/1.25 "IBM Plex Sans",sans-serif; text-align:center;
}
.seg button[aria-pressed="true"]{background:#1d2740;color:var(--bone);border-color:#3c4d78;box-shadow:inset 0 0 0 1px #3c4d78}
.seg button:focus-visible, .btn:focus-visible, input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

input[type=range]{width:100%;accent-color:var(--gold);height:30px}
.btn{
  min-height:48px;padding:12px 18px;cursor:pointer;border-radius:8px;
  font:600 14px/1 "IBM Plex Sans",sans-serif;
  background:var(--gold);color:#1a1405;border:none;
}
.btn.ghost{background:transparent;color:#c9c4b6;border:1px solid #2a3348}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 150px}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}

.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:13px}
.kv dt{color:#8e8a7e;margin:0}
.kv dd{margin:0;font-family:"IBM Plex Mono",monospace;color:#ded9cb;font-variant-numeric:tabular-nums;text-align:right}

.note{
  border-left:2px solid var(--blood); padding:10px 0 10px 12px;
  font-size:12px;line-height:1.55;color:#a39e90;
}
.note strong{color:#d3cec0;font-weight:600}

.fuse{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 7px;border-radius:4px;background:#1a2233;color:#8fa3cc;border:1px solid #27324a;
}
.tag.warn{background:#2a1a18;color:#e08a7e;border-color:#432622}
.tag.ok{background:#152619;color:#7fc99b;border-color:#203a28}

#sparkWrap{background:#0a0e15;border:1px solid #1c2233;border-radius:7px;padding:10px}
canvas#spark{width:100%;height:80px;display:block}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:#8e8a7e;font-family:"IBM Plex Mono",monospace}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}


#prevWrap{background:#0a0e15;border:1px solid #1c2233;border-radius:7px;padding:8px}
canvas#prev{width:100%;height:104px;display:block;border-radius:4px}
#lensBar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:grid;grid-template-columns:1fr 1fr auto;gap:10px 14px;align-items:center;
  padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px);
  background:rgba(7,9,13,.94);border-top:1px solid #1c2233;
}
#lensBar[hidden]{display:none!important}
#lensBar .f{display:flex;flex-direction:column;gap:2px;min-width:0}
#lensBar .f span{font:500 10px/1 "IBM Plex Mono",monospace;color:#8e8a7e;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between}
#lensBar .f span b{color:#e8b13f;font-weight:500}
#lensBar button{
  grid-row:span 2;min-height:56px;padding:0 20px;border-radius:7px;cursor:pointer;
  background:#e8b13f;color:#1a1405;border:none;font:600 13px "IBM Plex Sans",sans-serif;
}
@media (max-width:520px){ #lensBar{grid-template-columns:1fr 1fr} #lensBar button{grid-row:auto;grid-column:span 2;min-height:46px} }
#nonBar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:8px;
  padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);
  background:rgba(7,9,13,.92);border-top:1px solid #1c2233;
}
#nonBar[hidden]{display:none!important}
#nonBar button{
  flex:1;min-height:52px;border-radius:7px;cursor:pointer;
  background:#141926;color:#c9c4b6;border:1px solid #242c40;
  font:500 12px/1.3 "IBM Plex Sans",sans-serif;padding:6px 8px;
}
#nonBar button b{display:block;font-family:"IBM Plex Mono",monospace;color:#e8b13f;font-size:14px;margin-bottom:2px}

#participantIn,#protocolIn,#unlockIn{
  width:100%;min-height:40px;border-radius:7px;background:#070a10;color:#c9c4b6;border:1px solid #242c40;
  padding:8px 10px;font:500 13px "IBM Plex Mono",ui-monospace,monospace;
}
#unlockIn{width:auto;flex:1 1 150px}
textarea#protocolJson,textarea#studyOut{
  width:100%;min-height:70px;resize:vertical;border-radius:7px;
  background:#070a10;color:#c9c4b6;border:1px solid #242c40;padding:10px;
  font:400 11px/1.5 "IBM Plex Mono",ui-monospace,monospace;
}
textarea#tuneJson{
  width:100%;min-height:200px;resize:vertical;border-radius:7px;
  background:#070a10;color:#c9c4b6;border:1px solid #242c40;padding:10px;
  font:400 11px/1.5 "IBM Plex Mono",ui-monospace,monospace;
}
#devFields{display:flex;flex-direction:column;gap:14px}
#devFields .group h2{text-transform:uppercase}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="stage"><canvas id="view"></canvas></div>
